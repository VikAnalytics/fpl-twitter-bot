name: FPL Model Retraining

on:
  schedule:
    - cron: '0 6 * * 2'  # Tuesday 06:00 UTC — after the weekend's fixtures finish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train expected-points model
        run: python -m app.ml.train

      - name: Save model artifact (commit if promoted)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/ml/model.pkl app/ml/model_meta.json
          git commit -m "Retrain expected-points model" || exit 0
          git push
